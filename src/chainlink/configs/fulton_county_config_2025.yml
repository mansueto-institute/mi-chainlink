options:
  address_match_score_threshold: 0.8
  bad_address_path: data/bad_addresses_fulton.csv
  bad_name_path: data/bad_names.csv
  db_path: db/linked_fulton_raw_2025.db
  export_tables: false
  link_exclusions:
  - parcel_parcel_property_address_parcel_parcel_property_address_street_fuzzy_match
  - parcel_parcel_property_address_parcel_parcel_property_address_unit_fuzzy_match
  - parcel_parcel_property_address_parcel_parcel_property_address_street_match
  - parcel_parcel_property_address_parcel_parcel_property_address_address_match
  - parcel_parcel_property_address_parcel_parcel_property_address_unit_match
  - corp_presidents_address_corp_presidents_address_address_match
  - corp_presidents_address_corp_presidents_address_street_match
  - corp_presidents_address_corp_presidents_address_unit_match
  - corp_presidents_address_corp_presidents_address_street_fuzzy_match
  - corp_presidents_address_corp_presidents_address_unit_fuzzy_match
  load_only: false
  name_match_score_threshold: 0.8
  overwrite_db: true
  probabilistic: true
  update_config_only: false
schemas:
- schema_name: parcel
  tables:
  - address_cols:
    - property_address
    - mailing_address
    address_cols_og:
    - prop_addr
    - mailing_addr
    id_col: pin
    id_col_og: parcel_id
    name_cols:
    - tax_payer_name
    name_cols_og:
    - OWNERNAME
    table_name: parcel
    table_name_path: data/fulton_county_parcels.parquet
- schema_name: llc
  tables:
  - address_cols:
    - address
    address_cols_og:
    - address
    id_col: file_num
    id_col_og: BusinessId
    name_cols:
    - name
    name_cols_og:
    - BusinessName
    table_name: master
    table_name_path: data/georgia_llcs.parquet
  - address_cols:
    - address
    address_cols_og:
    - agent_address
    id_col: file_num
    id_col_og: BusinessId
    name_cols:
    - name
    name_cols_og:
    - Name
    table_name: managers
    table_name_path: data/agents.parquet